name: Verify Knockout
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: knockout
          POSTGRES_PASSWORD: knockout_test
          POSTGRES_DB: knockout_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U knockout -d knockout_test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://knockout:knockout_test@localhost:5432/knockout_test
      - run: npm run test:postgres -w @knockout/api
        env:
          DATABASE_URL: postgresql://knockout:knockout_test@localhost:5432/knockout_test
      - run: docker build -f apps/api/Dockerfile -t knockout-api:ci .
      - run: docker build -f apps/web/Dockerfile -t knockout-web:ci .
