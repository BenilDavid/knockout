# Local database only. Use: docker compose -f compose.db.yaml up -d
name: knockout-dev
services:
  db:
    restart: unless-stopped
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: knockout
      POSTGRES_PASSWORD: knockout_dev
      POSTGRES_DB: knockout
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - dev_postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U knockout -d knockout"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  dev_postgres:
